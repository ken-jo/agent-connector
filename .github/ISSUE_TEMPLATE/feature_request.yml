name: Feature request
description: Propose a new feature or improvement.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do that you cannot do today? Be specific.
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: Describe what you would like to happen. API shape, config key, CLI flag — whatever applies.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: What workarounds have you tried, or what other approaches would also solve the problem?
    validations:
      required: false

  - type: dropdown
    id: scope
    attributes:
      label: Scope
      description: Which part of the project does this touch?
      multiple: true
      options:
        - Core (defineConnector API, types, install engine)
        - Adapter — existing host
        - Adapter — new host (use the "Host adapter request" template instead)
        - CLI (agent-connector install / uninstall / doctor)
        - Telemetry / token counting
        - Content surfaces (commands / skills / subagents / memory)
        - Runtime / hook dispatch
        - SDK / test harness
        - Docs / site
        - Other
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Links, examples from other tools, or anything else relevant.
    validations:
      required: false
