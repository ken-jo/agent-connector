<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">MCP beginner architecture</title>
  <desc id="desc">A beginner-friendly MCP architecture diagram showing the user, host, MCP client, transport, MCP server, and application data boundary.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#09090b"/>
      <stop offset="0.55" stop-color="#111827"/>
      <stop offset="1" stop-color="#0f3d3e"/>
    </linearGradient>
    <linearGradient id="host" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#14b8a6"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0l10 5-10 5z" fill="#a1a1aa"/>
    </marker>
  </defs>
  <rect width="1280" height="720" fill="url(#bg)"/>
  <g opacity="0.12" stroke="#ffffff">
    <path d="M0 120h1280M0 240h1280M0 360h1280M0 480h1280M0 600h1280"/>
    <path d="M160 0v720M320 0v720M480 0v720M640 0v720M800 0v720M960 0v720M1120 0v720"/>
  </g>

  <text x="72" y="74" fill="#fafafa" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="800">MCP mental model</text>
  <text x="72" y="112" fill="#a1a1aa" font-family="Inter, Arial, sans-serif" font-size="18">The host runs the conversation. Your MCP server provides capabilities through a protocol boundary.</text>

  <g filter="url(#shadow)">
    <rect x="72" y="182" width="196" height="116" rx="18" fill="#18181b" stroke="#3f3f46"/>
    <text x="104" y="226" fill="#fafafa" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700">User</text>
    <text x="104" y="258" fill="#a1a1aa" font-family="Inter, Arial, sans-serif" font-size="15">asks a task</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="348" y="160" width="300" height="160" rx="22" fill="url(#host)" opacity="0.96"/>
    <text x="386" y="210" fill="#ffffff" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="800">Agent host</text>
    <text x="386" y="244" fill="#eef2ff" font-family="Inter, Arial, sans-serif" font-size="15">chat app / IDE / CLI</text>
    <rect x="386" y="266" width="224" height="34" rx="8" fill="#09090b" opacity="0.32"/>
    <text x="402" y="289" fill="#ffffff" font-family="JetBrains Mono, Consolas, monospace" font-size="14">embedded MCP client</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="736" y="158" width="236" height="164" rx="22" fill="#18181b" stroke="#3f3f46"/>
    <text x="770" y="207" fill="#fafafa" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="800">Your MCP server</text>
    <text x="770" y="241" fill="#a1a1aa" font-family="Inter, Arial, sans-serif" font-size="15">Node, Python, Go, etc.</text>
    <rect x="770" y="265" width="168" height="34" rx="8" fill="#27272a"/>
    <text x="786" y="288" fill="#fafafa" font-family="JetBrains Mono, Consolas, monospace" font-size="14">tool handlers</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="1040" y="182" width="168" height="116" rx="18" fill="#18181b" stroke="#3f3f46"/>
    <text x="1072" y="226" fill="#fafafa" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700">Your app</text>
    <text x="1072" y="258" fill="#a1a1aa" font-family="Inter, Arial, sans-serif" font-size="15">DB / API / files</text>
  </g>

  <path d="M268 240h70" stroke="#a1a1aa" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M648 240h78" stroke="#a1a1aa" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M972 240h58" stroke="#a1a1aa" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M736 284H648" stroke="#a1a1aa" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="660" y="206" width="58" height="68" rx="12" fill="#09090b" stroke="#3f3f46"/>
  <text x="678" y="235" fill="#fafafa" font-family="JetBrains Mono, Consolas, monospace" font-size="13">stdio</text>
  <text x="674" y="258" fill="#a1a1aa" font-family="JetBrains Mono, Consolas, monospace" font-size="13">HTTP</text>

  <g>
    <rect x="126" y="410" width="244" height="138" rx="18" fill="#111113" stroke="#3f3f46"/>
    <text x="156" y="452" fill="#fafafa" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700">Tools</text>
    <text x="156" y="486" fill="#a1a1aa" font-family="Inter, Arial, sans-serif" font-size="15">Callable actions with</text>
    <text x="156" y="510" fill="#a1a1aa" font-family="Inter, Arial, sans-serif" font-size="15">JSON input schemas</text>
  </g>
  <g>
    <rect x="438" y="410" width="244" height="138" rx="18" fill="#111113" stroke="#3f3f46"/>
    <text x="468" y="452" fill="#fafafa" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700">Resources</text>
    <text x="468" y="486" fill="#a1a1aa" font-family="Inter, Arial, sans-serif" font-size="15">Readable context from</text>
    <text x="468" y="510" fill="#a1a1aa" font-family="Inter, Arial, sans-serif" font-size="15">URIs or app state</text>
  </g>
  <g>
    <rect x="750" y="410" width="244" height="138" rx="18" fill="#111113" stroke="#3f3f46"/>
    <text x="780" y="452" fill="#fafafa" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700">Prompts</text>
    <text x="780" y="486" fill="#a1a1aa" font-family="Inter, Arial, sans-serif" font-size="15">Reusable task templates</text>
    <text x="780" y="510" fill="#a1a1aa" font-family="Inter, Arial, sans-serif" font-size="15">offered by the server</text>
  </g>

  <text x="126" y="618" fill="#f4c542" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700">Beginner rule:</text>
  <text x="264" y="618" fill="#d4d4d8" font-family="Inter, Arial, sans-serif" font-size="18">start with one read-only tool, one host, and one successful call before adding distribution, hooks, or writes.</text>
</svg>
